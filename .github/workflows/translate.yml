name: translate

on:
  push:
    branches: [main]
    paths:
      - "src/content/post/**.md"
      - "src/content/post/**.mdx"
      - "scripts/translate-posts.ts"
      - ".github/workflows/translate.yml"
  schedule:
    # daily 03:00 UTC fallback in case a push slipped past the path filter
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  # writing back the generated *.en.md files needs write
  contents: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # use a token that can push back to main even with branch protection
          token: ${{ secrets.GITHUB_TOKEN }}
          # avoid stale ref between push and commit
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Translate missing posts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DEEPSEEK_MODEL: deepseek-v4-flash
        run: npx tsx scripts/translate-posts.ts

      - name: Commit and push translations
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/post/*.en.md
          if git diff --staged --quiet; then
            echo "No new translations to commit."
            exit 0
          fi
          # bot-authored commit; skip CI re-trigger by tagging [skip ci]
          git commit -m "chore(content): auto-translate posts [skip ci]"
          git push
