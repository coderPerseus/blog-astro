name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at midnight UTC to sync issues
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Check for build and type issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Sync GitHub Issues
        run: npx tsx scripts/fetch-issues.ts
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # use astro check for issues
      - name: Run Astro check
        run: pnpm astro check

      # ensure build works
      - name: Run Astro build
        run: pnpm build
