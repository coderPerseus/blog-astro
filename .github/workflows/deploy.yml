name: deploy

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  schedule:
    - cron: "0 2 * * *" # Daily at 2am UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SITE: https://coderperseus.github.io
      BASE_PATH: /blog-astro
      BAOTA_DEPLOY_ENABLED: ${{ secrets.BAOTA_HOST != '' && secrets.BAOTA_USER != '' && secrets.BAOTA_PATH != '' && secrets.BAOTA_SSH_KEY != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync GitHub Issues (incremental + update detection)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/fetch-issues.ts

      - name: Translate new or updated posts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DEEPSEEK_MODEL: deepseek-v4-flash
        run: npx tsx scripts/translate-posts.ts

      - name: Commit synced content back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/post/
          if git diff --staged --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git commit -m "chore(content): sync posts and translations [skip ci]"
          # Rebase on top of latest remote main, then push. Retry on race.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying..."
            sleep $((attempt * 3))
          done
          echo "push still failing after retries"
          exit 1

      - name: Build for GitHub Pages
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build for BaoTa server
        if: env.BAOTA_DEPLOY_ENABLED == 'true'
        env:
          SITE: ${{ secrets.BAOTA_SITE || 'https://luckysnail.cn' }}
          BASE_PATH: /
        run: pnpm build

      - name: Deploy to BaoTa server
        if: env.BAOTA_DEPLOY_ENABLED == 'true'
        env:
          BAOTA_HOST: ${{ secrets.BAOTA_HOST }}
          BAOTA_PORT: ${{ secrets.BAOTA_PORT }}
          BAOTA_USER: ${{ secrets.BAOTA_USER }}
          BAOTA_PATH: ${{ secrets.BAOTA_PATH }}
          BAOTA_SSH_KEY: ${{ secrets.BAOTA_SSH_KEY }}
        run: |
          set -euo pipefail

          SSH_PORT="${BAOTA_PORT:-22}"
          if [[ ! "$SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::BAOTA_PORT must be a number, for example 22."
            exit 1
          fi

          if [[ "$BAOTA_HOST" == http://* || "$BAOTA_HOST" == https://* ]]; then
            echo "::error::BAOTA_HOST should be a host or IP only, without http:// or https://."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$BAOTA_SSH_KEY" | tr -d '\r' > ~/.ssh/baota_deploy_key
          chmod 600 ~/.ssh/baota_deploy_key

          if ! timeout 10 ssh-keygen -y -f ~/.ssh/baota_deploy_key >/dev/null; then
            echo "::error::BAOTA_SSH_KEY is not a valid unencrypted SSH private key."
            exit 1
          fi

          echo "Adding SSH host key for $BAOTA_HOST:$SSH_PORT"
          if ! timeout 20 ssh-keyscan -p "$SSH_PORT" -H "$BAOTA_HOST" >> ~/.ssh/known_hosts; then
            echo "::error::Unable to read the SSH host key. Check BAOTA_HOST, BAOTA_PORT, firewall, and whether SSH is open to GitHub Actions."
            exit 1
          fi

          SSH_TARGET="$BAOTA_USER@$BAOTA_HOST"
          SSH_OPTIONS=(-i ~/.ssh/baota_deploy_key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)

          echo "Testing SSH login for $SSH_TARGET"
          if ! ssh "${SSH_OPTIONS[@]}" "$SSH_TARGET" "echo ssh-ok"; then
            echo "::error::SSH login failed. Check BAOTA_USER and whether the public key is in that user's ~/.ssh/authorized_keys."
            exit 1
          fi

          REMOTE_PATH=$(printf '%q' "$BAOTA_PATH")
          echo "Checking remote path on $SSH_TARGET"
          if ! ssh "${SSH_OPTIONS[@]}" "$SSH_TARGET" "mkdir -p $REMOTE_PATH"; then
            echo "::error::Unable to create BAOTA_PATH. Check the parent directory and BAOTA_USER permissions."
            exit 1
          fi

          if ! ssh "${SSH_OPTIONS[@]}" "$SSH_TARGET" "test -d $REMOTE_PATH && test -w $REMOTE_PATH"; then
            echo "::error::BAOTA_PATH exists but is not writable by BAOTA_USER."
            exit 1
          fi

          echo "Checking rsync on $SSH_TARGET"
          if ! ssh "${SSH_OPTIONS[@]}" "$SSH_TARGET" "command -v rsync >/dev/null"; then
            echo "::error::rsync is not installed on the BaoTa server."
            exit 1
          fi

          rsync -az --delete \
            --exclude='.user.ini' \
            -e "ssh -i ~/.ssh/baota_deploy_key -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
            dist/ "$BAOTA_USER@$BAOTA_HOST:$BAOTA_PATH/"

      - name: Skip BaoTa deployment
        if: env.BAOTA_DEPLOY_ENABLED != 'true'
        run: echo "BaoTa deployment skipped because BAOTA_* secrets are not fully configured."
