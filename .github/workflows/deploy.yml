name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # Daily at 2am UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SITE: https://coderperseus.github.io
      BASE_PATH: /blog-astro
      BAOTA_DEPLOY_ENABLED: ${{ secrets.BAOTA_HOST != '' && secrets.BAOTA_USER != '' && secrets.BAOTA_PATH != '' && secrets.BAOTA_SSH_KEY != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync GitHub Issues (incremental + update detection)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/fetch-issues.ts

      - name: Translate new or updated posts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DEEPSEEK_MODEL: deepseek-v4-flash
        run: npx tsx scripts/translate-posts.ts

      - name: Commit synced content back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/post/
          if git diff --staged --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git commit -m "chore(content): sync posts and translations [skip ci]"
          # Rebase on top of latest remote main, then push. Retry on race.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying..."
            sleep $((attempt * 3))
          done
          echo "push still failing after retries"
          exit 1

      - name: Build for GitHub Pages
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Build for BaoTa server
        if: env.BAOTA_DEPLOY_ENABLED == 'true'
        env:
          SITE: ${{ secrets.BAOTA_SITE || 'https://luckysnail.cn' }}
          BASE_PATH: /
        run: pnpm build

      - name: Deploy to BaoTa server
        if: env.BAOTA_DEPLOY_ENABLED == 'true'
        env:
          BAOTA_HOST: ${{ secrets.BAOTA_HOST }}
          BAOTA_PORT: ${{ secrets.BAOTA_PORT }}
          BAOTA_USER: ${{ secrets.BAOTA_USER }}
          BAOTA_PATH: ${{ secrets.BAOTA_PATH }}
          BAOTA_SSH_KEY: ${{ secrets.BAOTA_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BAOTA_SSH_KEY" > ~/.ssh/baota_deploy_key
          chmod 600 ~/.ssh/baota_deploy_key
          ssh-keyscan -p "${BAOTA_PORT:-22}" "$BAOTA_HOST" >> ~/.ssh/known_hosts

          rsync -az --delete \
            -e "ssh -i ~/.ssh/baota_deploy_key -p ${BAOTA_PORT:-22}" \
            dist/ "$BAOTA_USER@$BAOTA_HOST:$BAOTA_PATH/"

      - name: Skip BaoTa deployment
        if: env.BAOTA_DEPLOY_ENABLED != 'true'
        run: echo "BaoTa deployment skipped because BAOTA_* secrets are not fully configured."
